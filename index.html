    <script>
        // 确保 PDFDocument 全局可用
        const { PDFDocument, PDFName, PDFArray, PDFNumber, PDFHexString } = PDFLib;

        // 设置 pdf.js worker（本地路径）
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

        // UTF-16BE 编码函数
        function stringToUtf16BeHex(str) {
            const codePoints = [];
            codePoints.push(0xFEFF); // UTF-16 BOM
            for (let i = 0; i < str.length; i++) {
                codePoints.push(str.charCodeAt(i));
            }

            const bytes = [];
            for (const cp of codePoints) {
                bytes.push((cp >> 8) & 0xFF);
                bytes.push(cp & 0xFF);
            }

            return bytes.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        // 从已打开的 pdf.js 文档中提取某页文本（用完立即释放，避免内存累积）
        async function extractPageText(pdfJsDoc, pageNum) {
            let page = null;
            try {
                page = await pdfJsDoc.getPage(pageNum);
                const textContent = await page.getTextContent();
                const text = textContent.items.map(item => item.str).join(' ');
                return text;
            } catch (error) {
                console.error(`提取第${pageNum}页文本失败:`, error);
                return '';
            } finally {
                if (page && typeof page.cleanup === 'function') {
                    try { page.cleanup(); } catch (e) {}
                }
            }
        }

        // AB 质谱仪版本 - 提取 Sample Name
        function extractSampleNameAB(text) {
            // 匹配 "Sample Name" 后面的内容
            const match = text.match(/Sample\s*Name\s*([^\n\r\f\x0b]+?)(?=\s+(?:Sample\s*Type|Injection|Acquisition|Project|Instrument|Data\s*File|Result|RT\s*\(|$))/i);
            if (match) {
                return match[1].trim();
            }

            const match2 = text.match(/Sample\s*Name\s*([A-Za-z0-9\-_\.\(\)\[\]\s]+)/i);
            if (match2) {
                const name = match2[1].trim();
                if (name.length > 0 && name.length < 100) {
                    return name;
                }
            }

            const match3 = text.match(/Sample\s+([A-Z][0-9]+)/i);
            if (match3) {
                return match3[1].trim();
            }

            return null;
        }

        // GC-MS 版本 - 提取样品名称
        function extractSampleNameGCMS(text) {
            // 1. 优先匹配 "样品名称"（中文）
            const matchCN = text.match(/样品名称\s*[:：]?\s*([^\n\r\f\x0b]+?)(?=\s+(?:稀释|样品类型|采集|项目|仪器|数据文件|结果|RT\s*\(|$))/i);
            if (matchCN) {
                const name = matchCN[1].trim();
                if (name.length > 0 && name.length < 100) {
                    return name;
                }
            }

            // 2. 匹配 "Sample Name"（英文）
            const match = text.match(/Sample\s*Name\s*[:：]?\s*([^\n\r\f\x0b]+?)(?=\s+(?:Dilution|Sample\s*Type|Injection|Acquisition|Project|Instrument|Data\s*File|Result|RT\s*\(|稀释|样品类型|采集|项目|仪器|数据文件|结果|$))/i);
            if (match) {
                const name = match[1].trim();
                if (name.length > 0 && name.length < 100) {
                    return name;
                }
            }

            // 3. 匹配 "数据文件" 中的样品名
            const matchDataFile = text.match(/数据文件\s*[:：]?\s*([A-Za-z0-9\-_\.]+)/i);
            if (matchDataFile) {
                const dataFile = matchDataFile[1].trim();
                const name = dataFile.replace(/\.D$/i, '');
                if (name.length > 0) {
                    return name;
                }
            }

            // 4. 匹配 "Data File" 中的样品名
            const matchDataFileEN = text.match(/Data\s*File\s*[:：]?\s*([A-Za-z0-9\-_\.]+)/i);
            if (matchDataFileEN) {
                const dataFile = matchDataFileEN[1].trim();
                const name = dataFile.replace(/\.D$/i, '');
                if (name.length > 0) {
                    return name;
                }
            }

            // 5. 匹配 "Sample" 后面的标识
            const match3 = text.match(/Sample\s+([A-Z][A-Za-z0-9\-_]*)/i);
            if (match3) {
                return match3[1].trim();
            }

            return null;
        }

        // 根据仪器类型选择提取函数
        function extractSampleName(text, instrumentType) {
            if (instrumentType === 'gcms') {
                return extractSampleNameGCMS(text);
            } else {
                return extractSampleNameAB(text);
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 显示错误
        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // 更新进度
        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        // 处理文件选择
        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                showError('请选择有效的 PDF 文件');
                return;
            }

            selectedFile = file;
            selectedInstrument = instrumentType.value;

            // 显示文件信息
            fileName.textContent = file.name;
            fileSize.textContent = '大小: ' + formatFileSize(file.size);
            fileInfo.classList.add('show');

            // 读取 PDF 获取页数
            try {
                updateProgress(10, '正在读取 PDF...');
                progressContainer.classList.add('show');
                processBtn.disabled = true;

                const arrayBuffer = await file.arrayBuffer();
                pdfDoc = await PDFDocument.load(arrayBuffer);
                const pageCount = pdfDoc.getPageCount();

                updateProgress(30, `检测到 ${pageCount} 页`);

                // 提取每页的文本并生成书签标题
                updateProgress(35, '正在提取页面内容...');
                pageBookmarks = [];

                // 复用同一个 pdf.js 文档实例（避免每页重复解析整份 PDF 导致内存爆炸）
                // 同时配置 cMapUrl 解决中文/CJK 字体 CMap 加载警告
                // standardFontDataUrl 配置解决标准字体（如 FoxitSerifBold.pfb）加载警告
                // 使用绝对路径防止相对路径拼接错误（避免 /lib/lib/ 重复路径问题）
                const pdfJsDoc = await pdfjsLib.getDocument({
                    data: arrayBuffer,
                    cMapUrl: '/lib/cmaps/',
                    cMapPacked: true,
                    standardFontDataUrl: '/lib/standard_fonts/',
                    disableFontFace: true,
                    isEvalSupported: false
                }).promise;

                try {
                    for (let i = 1; i <= pageCount; i++) {
                        const text = await extractPageText(pdfJsDoc, i);
                        const sampleName = extractSampleName(text, selectedInstrument);
                        const bookmarkTitle = sampleName || `第 ${i} 页`;
                        pageBookmarks.push(bookmarkTitle);
                        updateProgress(35 + Math.round((i / pageCount) * 15), `已提取第 ${i}/${pageCount} 页...`);
                        // 让出主线程，避免长任务挂起 UI 与 GC
                        if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
                    }
                } finally {
                    try { await pdfJsDoc.cleanup(); } catch (e) {}
                    try { await pdfJsDoc.destroy(); } catch (e) {}
                }

                // 显示书签预览（可编辑） - 两列布局
                renderBookmarkList();
                
                bookmarkPreview.classList.add('show');

                updateProgress(50, '准备添加书签...');

                processBtn.classList.add('show');
                resetBtn.classList.add('show');
                uploadArea.style.display = 'none';

                updateProgress(0, '等待开始...');
                processBtn.disabled = false;

            } catch (error) {
                showError('读取 PDF 失败: ' + error.message);
                progressContainer.classList.remove('show');
                resetForm();
            }
        }

        // 添加书签
        async function addBookmarks() {
            if (!pdfDoc) return;

            try {
                processBtn.disabled = true;
                processBtn.innerHTML = '<span class="spinner"></span>处理中...';

                const pageCount = pdfDoc.getPageCount();

                // 创建所有 outline 条目
                const outlineRefs = [];
                for (let i = 0; i < pageCount; i++) {
                    const page = pdfDoc.getPage(i);
                    const pageRef = page.ref;

                    // 创建目标数组
                    const destArray = pdfDoc.context.obj([
                        pageRef,
                        PDFName.of('Fit')
                    ]);

                    // GC-MS：使用原始书签名称；AB 质谱仪：使用中文翻译（如果有）
                    const bookmarkTitle = selectedInstrument === 'gcms'
                        ? pageBookmarks[i] || `第 ${i + 1} 页`
                        : (findTranslation(pageBookmarks[i]) || pageBookmarks[i] || `第 ${i + 1} 页`);
                    
                    // 使用 UTF-16BE 编码的十六进制字符串
                    const titleHex = stringToUtf16BeHex(bookmarkTitle);
                    const titleString = PDFHexString.of(titleHex);

                    const outlineDict = pdfDoc.context.obj({
                        Title: titleString,
                        Parent: null,
                        Dest: destArray
                    });

                    const outlineRef = pdfDoc.context.register(outlineDict);
                    outlineRefs.push(outlineRef);

                    const percent = 50 + Math.round((i + 1) / pageCount * 20);
                    updateProgress(percent, `正在创建第 ${i + 1}/${pageCount} 页的书签: ${bookmarkTitle}...`);
                }

                // 设置 Next 和 Prev 指针
                for (let i = 0; i < outlineRefs.length; i++) {
                    const outline = outlineRefs[i];
                    const dict = pdfDoc.context.lookup(outline);

                    if (i > 0) {
                        dict.set(PDFName.of('Prev'), outlineRefs[i - 1]);
                    }
                    if (i < outlineRefs.length - 1) {
                        dict.set(PDFName.of('Next'), outlineRefs[i + 1]);
                    }
                }

                updateProgress(75, '正在设置文档大纲...');

                // 创建 Outlines 根对象
                const outlinesDict = pdfDoc.context.obj({
                    Type: PDFName.of('Outlines'),
                    First: outlineRefs[0],
                    Last: outlineRefs[outlineRefs.length - 1],
                    Count: pageCount
                });

                const outlinesRef = pdfDoc.context.register(outlinesDict);

                // 设置每个 outline 条目的 Parent
                for (const outlineRef of outlineRefs) {
                    const dict = pdfDoc.context.lookup(outlineRef);
                    dict.set(PDFName.of('Parent'), outlinesRef);
                }

                // 设置文档的 Outlines 引用
                pdfDoc.catalog.set(PDFName.of('Outlines'), outlinesRef);

                updateProgress(90, '正在保存文件...');

                // 保存 PDF
                const pdfBytes = await pdfDoc.save();

                updateProgress(100, '完成!');

                // 下载文件
                const newFileName = fileName.textContent.replace('.pdf', '_带书签.pdf');
                download(pdfBytes, newFileName, 'application/pdf');

                successMessage.classList.add('show');
                processBtn.innerHTML = '添加书签并下载';

                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 5000);

            } catch (error) {
                showError('添加书签失败: ' + error.message);
                processBtn.disabled = false;
                processBtn.innerHTML = '添加书签并下载';
            }
        }

        // 规范化名称（去除所有空格、零宽字符、统一连接符）
        function normalizeName(name) {
            return name.replace(/[\s\u200c\u200b\-]/g, '').toLowerCase();
        }

        // 模式匹配规则（处理数字后缀变化）
        const patternRules = [
            { pattern: /(\w+[+-].*?)(\d+)$/, desc: '后缀数字变化' }, // 如 SST-1、LOQ-3 等
        ];

        // 查找中文翻译
        function findTranslation(originalName) {
            // 1. 精确匹配
            if (translationMap[originalName]) {
                return translationMap[originalName];
            }
            
            // 2. 规范化后匹配（忽略空格、大小写）
            const normalized = normalizeName(originalName);
            for (const key in translationMap) {
                if (normalizeName(key) === normalized) {
                    return translationMap[key];
                }
            }
            
            // 3. 模式匹配（处理数字后缀变化，如 -1、-2、-3...）
            // 按键长从长到短排序，优先匹配更长的键
            const sortedKeys = Object.keys(translationMap).sort((a, b) => b.length - a.length);
            for (const key of sortedKeys) {
                // 提取模板（去掉末尾数字）
                const keyPrefix = key.replace(/[\s\-]*(\d+)$/, '');
                const namePrefix = originalName.replace(/[\s\-]*(\d+)$/, '');
                
                // 前缀匹配（忽略空格、减号差异）
                if (normalizeName(keyPrefix) === normalizeName(namePrefix)) {
                    // 提取原始名称中的数字
                    const numMatch = originalName.match(/(\d+)$/);
                    if (numMatch) {
                        const num = numMatch[1];
                        // 替换中文模板中的数字
                        const chineseTemplate = translationMap[key];
                        const chineseResult = chineseTemplate.replace(/\d+$/, num);
                        return chineseResult;
                    }
                    return translationMap[key];
                }
            }
            
            // 4. 前缀匹配（处理动态内容，如 Sample Test-xxx、Robustness xxx）
            // Sample Test-xxx → 样品检测-xxx
            if (originalName.startsWith('Sample Test-')) {
                const dynamicContent = originalName.substring('Sample Test-'.length);
                return '样品检测-' + dynamicContent;
            }
            
            // Robustness xxx-Blank solution → 耐用性xxx-空白溶液
            const robustnessMatch = originalName.match(/^Robustness\s+(.+?)-(Blank solution|Test solution|Reference solution|Spiked solution)$/i);
            if (robustnessMatch) {
                const condition = robustnessMatch[1]; // 动态条件（温度、流速等）
                const type = robustnessMatch[2].toLowerCase();
                const typeMap = {
                    'blank solution': '空白溶液',
                    'test solution': '供试品溶液',
                    'reference solution': '对照品溶液',
                    'spiked solution': '加标溶液'
                };
                return '耐用性' + condition + '-' + typeMap[type];
            }
            
            // 5. 包含匹配（处理部分匹配）- 优先匹配更长的键
            let longestMatch = null;
            let longestKeyLength = 0;
            for (const key in translationMap) {
                const keyNormalized = normalizeName(key);
                if (normalized.includes(keyNormalized)) {
                    // 只有当整个名称不包含更长的前缀时才匹配
                    // 例如：Intermediate precision-Linear-C1 不应该只匹配 Linear-C1
                    if (key.length > longestKeyLength) {
                        // 额外检查：如果键是较短的前缀，不应该覆盖更长的匹配
                        // 比如 Linear-C1 是 8 字符，而 Intermediate precision... 更长
                        longestMatch = key;
                        longestKeyLength = key.length;
                    }
                }
            }
            if (longestMatch && longestKeyLength > 0) {
                return translationMap[longestMatch];
            }
            
            return '';
        }

        // 渲染书签列表
        function renderBookmarkList() {
            // GC-MS 不做中英文对照，只显示原始名称一列
            if (selectedInstrument === 'gcms') {
                let bookmarksHtml = `
                    <div class="bookmark-header">
                        <span>页码</span>
                        <span>书签名称</span>
                    </div>
                `;
                for (let i = 0; i < pageBookmarks.length; i++) {
                    const bookmarkName = pageBookmarks[i];
                    bookmarksHtml += `
                        <div class="bookmark-item">
                            <span class="bookmark-page-num">P${i + 1}</span>
                            <input type="text" class="bookmark-input" data-index="${i}" value="${bookmarkName.replace(/"/g, '&quot;')}">
                        </div>
                    `;
                }
                bookmarkList.innerHTML = bookmarksHtml;
                
                // 绑定输入框变化事件
                bookmarkList.querySelectorAll('.bookmark-input').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        pageBookmarks[index] = e.target.value.trim() || `第 ${index + 1} 页`;
                    });
                });
            } else {
                // AB 质谱仪：中英文两列对照
                let bookmarksHtml = `
                    <div class="bookmark-header">
                        <span>页码</span>
                        <span>原始书签（英文）</span>
                        <span>中文书签</span>
                    </div>
                `;
                for (let i = 0; i < pageBookmarks.length; i++) {
                    const originalName = pageBookmarks[i];
                    const chineseName = findTranslation(originalName);
                    bookmarksHtml += `
                        <div class="bookmark-item">
                            <span class="bookmark-page-num">P${i + 1}</span>
                            <input type="text" class="bookmark-input" data-index="${i}" data-type="original" value="${originalName.replace(/"/g, '&quot;')}" readonly>
                            <input type="text" class="bookmark-input" data-index="${i}" data-type="chinese" value="${chineseName.replace(/"/g, '&quot;')}" placeholder="输入中文名称...">
                        </div>
                    `;
                }
                bookmarkList.innerHTML = bookmarksHtml;
                
                // 绑定中文输入框变化事件
                bookmarkList.querySelectorAll('.bookmark-input[data-type="chinese"]').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        const originalName = pageBookmarks[index];
                        const chineseValue = e.target.value.trim();
                        if (chineseValue) {
                            translationMap[originalName] = chineseValue;
                        } else {
                            delete translationMap[originalName];
                        }
                    });
                });
            }
        }

        // 重置表单
        function resetForm() {
            selectedFile = null;
            pdfDoc = null;
            pageBookmarks = [];
            fileInput.value = '';

            fileInfo.classList.remove('show');
            bookmarkPreview.classList.remove('show');
            progressContainer.classList.remove('show');
            processBtn.classList.remove('show');
            resetBtn.classList.remove('show');
            successMessage.classList.remove('show');
            errorMessage.classList.remove('show');

            uploadArea.style.display = 'block';
            processBtn.disabled = false;
            processBtn.innerHTML = '添加书签并下载';
            updateProgress(0, '准备中...');
        }

        // 事件监听
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        processBtn.addEventListener('click', addBookmarks);
        resetBtn.addEventListener('click', resetForm);
    </script>
